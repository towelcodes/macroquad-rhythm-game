[package]
name = "macroquad-game"
version = "0.1.0"
edition = "2024"

[dependencies]
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
macroquad = "0.4.14"
crossbeam-channel = "0.5.15"
triple_buffer = "9.0.0"
arc-swap = "1.9.1"
kira = "0.12.2"
serial_test = "3.5.0"
rfd = "0.15"

[target.'cfg(target_os="macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics2 = "0.4.1"

[target.'cfg(target_os="windows")'.dependencies.windows]
version = ">=0.59, <=0.62"
features = [
    "Data_Xml_Dom",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[profile.dev.package.kira]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-format-wav]
opt-level = 3

[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
